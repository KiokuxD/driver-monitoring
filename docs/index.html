<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f23; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; min-height: 100vh; padding: 10px; }
        h1 { font-size: 1.3em; margin: 10px 0; color: #00d4ff; }
        #videoContainer { position: relative; display: inline-block; width: 100%; max-width: 640px; }
        #video { width: 100%; border: 2px solid #00d4ff; border-radius: 8px; transform: scaleX(-1); display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        .controls { margin: 10px 0; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; margin: 4px; font-weight: bold; }
        .btn:active { background: #00a8cc; }
        .btn.stop { background: #f44336; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { display: flex; justify-content: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .card { background: #16213e; padding: 8px 12px; border-radius: 8px; min-width: 75px; }
        .card .label { font-size: 0.65em; color: #888; }
        .card .value { font-size: 1.1em; font-weight: bold; }
        #alertBox { padding: 12px; border-radius: 8px; margin: 10px 0; font-weight: bold; font-size: 1em; transition: all 0.3s; }
        .safe { background: #0a3d0a; color: #4caf50; }
        .warning { background: #3d2a0a; color: #ff9800; }
        .danger { background: #3d0a0a; color: #f44336; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f23; display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        #loading.hidden { display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #fps { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; font-size: 0.75em; }
        #history { max-height: 100px; overflow-y: auto; text-align: left; font-size: 0.8em; background: #16213e; padding: 8px; border-radius: 8px; margin-top: 10px; }
        #history div { padding: 2px 0; border-bottom: 1px solid #1a1a3e; }
        #debug { font-size: 0.7em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top:15px">Loading MediaPipe Face Landmarker...</p>
        <p style="font-size:0.8em;color:#888;margin-top:5px">First time may take 30-60 seconds</p>
    </div>

    <h1>🚗 Driver Monitoring System</h1>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="fps">FPS: 0</div>
    </div>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="startCamera()">Start Camera</button>
        <button class="btn stop" id="stopBtn" onclick="stopCamera()" disabled>Stop</button>
        <button class="btn" onclick="resetAlerts()">Reset</button>
    </div>

    <div class="status">
        <div class="card"><div class="label">FACE</div><div class="value" id="faceVal">-</div></div>
        <div class="card"><div class="label">EAR</div><div class="value" id="earVal">-</div></div>
        <div class="card"><div class="label">MAR</div><div class="value" id="marVal">-</div></div>
        <div class="card"><div class="label">GAZE</div><div class="value" id="gazeVal">-</div></div>
        <div class="card"><div class="label">YAW</div><div class="value" id="yawVal">-</div></div>
        <div class="card"><div class="label">PITCH</div><div class="value" id="pitchVal">-</div></div>
    </div>

    <div id="alertBox" class="safe">SAFE - No alerts</div>
    <div id="history"></div>
    <div id="debug"></div>

    <script type="module">
        // ========== IMPORTS ==========
        import { FaceLandmarker, FilesetResolver, DrawingUtils } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

        // ========== CONFIG ==========
        const EAR_THRESHOLD = 0.25;
        const EAR_CONSEC = 20;
        const MAR_THRESHOLD = 0.60;
        const MAR_CONSEC = 15;
        const YAW_THRESHOLD = 25;
        const PITCH_THRESHOLD = 20;
        const POSE_CONSEC = 15;

        // ========== STATE ==========
        let faceLandmarker = null;
        let streaming = false;
        let earCnt = 0, marCnt = 0, yawCnt = 0, pitchCnt = 0;
        let frameIdx = 0;
        let baseYaw = 0, basePitch = 0, calibrated = false;
        let lastVideoTime = -1;
        let frameCount = 0, lastFpsTime = Date.now();

        // One Euro Filter params
        let prevEAR = 0.3, prevMAR = 0.1, prevYaw = 0, prevPitch = 0;
        const beta = 0.7, alpha = 0.15;

        function oneEuro(prev, raw) {
            const diff = Math.abs(raw - prev);
            const rate = diff * 30;
            const c = 1.0 / (1.0 + (1.0 / beta) * Math.exp(-rate * alpha));
            return prev + c * (raw - prev);
        }

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');

        // ========== LANDMARK INDICES (478-point) ==========
        const L_EYE = [33, 160, 158, 133, 153, 144];
        const R_EYE = [362, 385, 387, 263, 373, 380];
        const MOUTH = [61, 13, 14, 87, 178, 88, 95, 78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

        // ========== LOAD MODEL ==========
        async function loadModel() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1,
                minFaceDetectionConfidence: 0.3,
                minFacePresenceConfidence: 0.3,
                minTrackingConfidence: 0.3,
                outputFaceBlendshapes: true,
                outputFacialTransformationMatrixes: true
            });
            document.getElementById('loading').classList.add('hidden');
        }

        // ========== GEOMETRY ==========
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + ((a.z || 0) - (b.z || 0)) ** 2);
        }

        function calcEAR(eye) {
            const v1 = dist(eye[1], eye[5]);
            const v2 = dist(eye[2], eye[4]);
            const h = dist(eye[0], eye[3]);
            return (v1 + v2) / (2.0 * h + 0.001);
        }

        function calcMAR(mouth) {
            let total = 0;
            for (let i = 0; i < mouth.length - 1; i++) {
                total += dist(mouth[i], mouth[i + 1]);
            }
            const h = dist(mouth[0], mouth[Math.floor(mouth.length / 2)]);
            return total / (mouth.length * h + 0.001);
        }

        // ========== HEAD POSE FROM MATRIX ==========
        function matrixToEuler(m) {
            // m is 4x4 flattened column-major
            const sy = Math.sqrt(m[0] * m[0] + m[1] * m[1]);
            const singular = sy < 1e-6;
            let yaw, pitch, roll;
            if (!singular) {
                yaw = Math.atan2(m[8], m[10]);
                pitch = Math.atan2(-m[9], sy);
                roll = Math.atan2(m[1], m[5]);
            } else {
                yaw = Math.atan2(-m[2], m[10]);
                pitch = Math.atan2(-m[9], sy);
                roll = 0;
            }
            return {
                yaw: yaw * 180 / Math.PI,
                pitch: pitch * 180 / Math.PI,
                roll: roll * 180 / Math.PI
            };
        }

        // ========== GAZE FROM LANDMARKS ==========
        function getGaze(pts) {
            const lIn = pts[33], lOut = pts[133];
            const rIn = pts[362], rOut = pts[263];

            // Approximate iris center from eye contour midpoints
            const lIris = { x: (pts[159].x + pts[145].x) / 2, y: (pts[159].y + pts[145].y) / 2 };
            const rIris = { x: (pts[386].x + pts[374].x) / 2, y: (pts[386].y + pts[374].y) / 2 };

            const lR = (lIris.x - lIn.x) / (lOut.x - lIn.x + 0.001);
            const rR = (rIris.x - rIn.x) / (rOut.x - rIn.x + 0.001);
            const avg = (lR + rR) / 2;

            if (avg < 0.35) return 'right';
            if (avg > 0.65) return 'left';
            return 'center';
        }

        // ========== DETECTION LOOP ==========
        function detect() {
            if (!streaming) return;

            if (video.currentTime !== lastVideoTime && faceLandmarker) {
                lastVideoTime = video.currentTime;

                const results = faceLandmarker.detectForVideo(video, performance.now());

                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;
                ctx.clearRect(0, 0, overlay.width, overlay.height);

                if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
                    calibrated = false;
                    updateUI({ face: false, ear: 0, mar: 0, gaze: '-', yaw: 0, pitch: 0, alerts: ['NO_FACE'] });
                    requestAnimationFrame(detect);
                    return;
                }

                const landmarks = results.faceLandmarks[0];
                const blendshapes = results.faceBlendshapes ? results.faceBlendshapes[0] : null;
                const matrix = results.facialTransformationMatrixes ? results.facialTransformationMatrixes[0] : null;

                // Draw landmarks
                ctx.fillStyle = '#00ff00';
                for (const p of landmarks) {
                    ctx.beginPath();
                    ctx.arc(p.x * overlay.width, p.y * overlay.height, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // EAR from blendshapes (most accurate)
                let ear = 0.3;
                if (blendshapes) {
                    const lBlink = blendshapes.find(b => b.categoryName === 'eyeBlinkLeft');
                    const rBlink = blendshapes.find(b => b.categoryName === 'eyeBlinkRight');
                    const lOpen = lBlink ? 1 - lBlink.score : 0.5;
                    const rOpen = rBlink ? 1 - rBlink.score : 0.5;
                    ear = (lOpen + rOpen) / 2;
                } else {
                    ear = (calcEAR(L_EYE.map(i => landmarks[i])) + calcEAR(R_EYE.map(i => landmarks[i]))) / 2;
                }
                ear = oneEuro(prevEAR, ear);
                prevEAR = ear;

                // MAR from blendshapes
                let mar = 0;
                if (blendshapes) {
                    const jawOpen = blendshapes.find(b => b.categoryName === 'jawOpen');
                    mar = jawOpen ? jawOpen.score : 0;
                } else {
                    mar = calcMAR(MOUTH.slice(0, 12).map(i => landmarks[i]));
                }
                mar = oneEuro(prevMAR, mar);
                prevMAR = mar;

                // Head pose from transformation matrix (most accurate)
                let yaw = 0, pitch = 0;
                if (matrix) {
                    const euler = matrixToEuler(matrix);
                    yaw = euler.yaw;
                    pitch = euler.pitch;
                } else {
                    // Fallback: geometric estimation
                    const nose = landmarks[1];
                    const lEye = landmarks[33];
                    const rEye = landmarks[263];
                    const forehead = landmarks[10];
                    const chin = landmarks[152];
                    const eyeCx = (lEye.x + rEye.x) / 2;
                    const eyeW = dist(lEye, rEye);
                    const faceH = dist(forehead, chin);
                    const faceMidY = (forehead.y + chin.y) / 2;
                    yaw = ((nose.x - eyeCx) / eyeW) * 50;
                    pitch = ((nose.y - faceMidY) / (faceH * 0.5)) * 50;
                }
                yaw = oneEuro(prevYaw, yaw);
                pitch = oneEuro(prevPitch, pitch);
                prevYaw = yaw;
                prevPitch = pitch;

                // Calibration
                frameIdx++;
                if (frameIdx <= 30) {
                    baseYaw = yaw;
                    basePitch = pitch;
                    calibrated = false;
                } else {
                    calibrated = true;
                }

                const adjYaw = calibrated ? yaw - baseYaw : 0;
                const adjPitch = calibrated ? pitch - basePitch : 0;

                // Gaze
                const gaze = calibrated ? getGaze(landmarks) : 'center';

                // ===== ALERTS =====
                const alerts = [];

                if (ear < EAR_THRESHOLD) { earCnt++; if (earCnt >= EAR_CONSEC) alerts.push('DROWSY'); }
                else earCnt = 0;

                if (mar > MAR_THRESHOLD) { marCnt++; if (marCnt >= MAR_CONSEC) alerts.push('YAWNING'); }
                else marCnt = 0;

                if (Math.abs(adjYaw) > YAW_THRESHOLD) { yawCnt++; if (yawCnt >= POSE_CONSEC) alerts.push('LOOKING_SIDE'); }
                else yawCnt = 0;

                if (adjPitch > PITCH_THRESHOLD) { pitchCnt++; if (pitchCnt >= POSE_CONSEC) alerts.push('LOOKING_DOWN'); }
                else pitchCnt = 0;

                updateUI({
                    face: true, ear: ear.toFixed(3), mar: mar.toFixed(3),
                    gaze, yaw: adjYaw.toFixed(1), pitch: adjPitch.toFixed(1), alerts
                });

                // FPS
                frameCount++;
                if (Date.now() - lastFpsTime >= 1000) {
                    document.getElementById('fps').textContent = 'FPS: ' + frameCount;
                    frameCount = 0;
                    lastFpsTime = Date.now();
                }
            }

            requestAnimationFrame(detect);
        }

        // ========== UI ==========
        function updateUI(data) {
            document.getElementById('faceVal').innerHTML = data.face ? '✅' : '❌';
            document.getElementById('earVal').textContent = data.ear;
            document.getElementById('marVal').textContent = data.mar;
            document.getElementById('gazeVal').textContent = data.gaze;
            document.getElementById('yawVal').textContent = data.yaw + '°';
            document.getElementById('pitchVal').textContent = data.pitch + '°';

            const box = document.getElementById('alertBox');
            if (!data.alerts || data.alerts.length === 0) {
                box.className = 'safe';
                box.textContent = 'SAFE - No alerts';
            } else {
                box.className = 'danger';
                box.textContent = '⚠️ ' + data.alerts.join(' | ');
                const hist = document.getElementById('history');
                const div = document.createElement('div');
                div.textContent = new Date().toLocaleTimeString() + ' - ' + data.alerts.join(', ');
                hist.prepend(div);
            }
        }

        // ========== CAMERA ==========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                streaming = true;
                frameIdx = 0;
                calibrated = false;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                video.onloadedmetadata = () => { detect(); };
            } catch (err) {
                alert('Camera error: ' + err.message);
            }
        }

        function stopCamera() {
            streaming = false;
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            ctx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function resetAlerts() {
            earCnt = marCnt = yawCnt = pitchCnt = 0;
            frameIdx = 0;
            calibrated = false;
            document.getElementById('alertBox').className = 'safe';
            document.getElementById('alertBox').textContent = 'SAFE - Alerts reset';
        }

        // Expose to global for button onclick
        window.startCamera = startCamera;
        window.stopCamera = stopCamera;
        window.resetAlerts = resetAlerts;

        loadModel();
    </script>
</body>
</html>
