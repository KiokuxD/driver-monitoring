<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f23; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; min-height: 100vh; padding: 10px; }
        h1 { font-size: 1.3em; margin: 10px 0; color: #00d4ff; }
        #videoContainer { position: relative; display: inline-block; width: 100%; max-width: 640px; }
        #video { width: 100%; border: 2px solid #00d4ff; border-radius: 8px; transform: scaleX(-1); display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        .controls { margin: 10px 0; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; margin: 4px; font-weight: bold; }
        .btn:active { background: #00a8cc; }
        .btn.stop { background: #f44336; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { display: flex; justify-content: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
        .card { background: #16213e; padding: 6px 10px; border-radius: 8px; min-width: 68px; }
        .card .label { font-size: 0.6em; color: #888; }
        .card .value { font-size: 0.95em; font-weight: bold; }
        .card.warn .value { color: #ff9800; }
        .card.danger .value { color: #f44336; }
        .card.ok .value { color: #4caf50; }
        #alertBox { padding: 12px; border-radius: 8px; margin: 10px 0; font-weight: bold; font-size: 1em; transition: all 0.3s; }
        .safe { background: #0a3d0a; color: #4caf50; }
        .warning { background: #3d2a0a; color: #ff9800; }
        .danger { background: #3d0a0a; color: #f44336; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f23; display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        #loading.hidden { display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #fps { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; font-size: 0.75em; }
        #history { max-height: 120px; overflow-y: auto; text-align: left; font-size: 0.75em; background: #16213e; padding: 8px; border-radius: 8px; margin-top: 10px; }
        #history div { padding: 2px 0; border-bottom: 1px solid #1a1a3e; }
        .section-title { font-size: 0.7em; color: #00d4ff; margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top:15px">Loading MediaPipe Face Landmarker...</p>
        <p style="font-size:0.8em;color:#888;margin-top:5px">First time may take 30-60 seconds</p>
    </div>

    <h1>🚗 Driver Monitoring System</h1>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="fps">FPS: 0</div>
    </div>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="startCamera()">Start Camera</button>
        <button class="btn stop" id="stopBtn" onclick="stopCamera()" disabled>Stop</button>
        <button class="btn" onclick="resetAlerts()">Reset</button>
    </div>

    <div class="section-title">Face Metrics</div>
    <div class="status">
        <div class="card"><div class="label">FACE</div><div class="value" id="faceVal">-</div></div>
        <div class="card"><div class="label">EAR</div><div class="value" id="earVal">-</div></div>
        <div class="card"><div class="label">MAR</div><div class="value" id="marVal">-</div></div>
        <div class="card"><div class="label">GAZE</div><div class="value" id="gazeVal">-</div></div>
        <div class="card"><div class="label">YAW</div><div class="value" id="yawVal">-</div></div>
        <div class="card"><div class="label">PITCH</div><div class="value" id="pitchVal">-</div></div>
    </div>

    <div class="section-title">Micro-Signs (Research-Based)</div>
    <div class="status">
        <div class="card"><div class="label">PERCLOS</div><div class="value" id="perclosVal">0%</div></div>
        <div class="card"><div class="label">BLINK/ms</div><div class="value" id="blinkDurVal">-</div></div>
        <div class="card"><div class="label">BLINK/min</div><div class="value" id="blinkRateVal">-</div></div>
        <div class="card"><div class="label">MICROSLEEP</div><div class="value" id="microsleepVal">0</div></div>
        <div class="card"><div class="label">GAZE_OFF</div><div class="value" id="gazeOffVal">0.0s</div></div>
        <div class="card"><div class="label">NOD</div><div class="value" id="nodVal">0</div></div>
    </div>

    <div id="alertBox" class="safe">SAFE - No alerts</div>
    <div id="history"></div>
    <div id="log" style="margin-top:10px;text-align:left;font-size:0.7em;background:#111;color:#0f0;padding:8px;border-radius:8px;max-height:150px;overflow-y:auto;font-family:monospace;word-break:break-all;"></div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

        // ==================== CONFIG ====================
        const EAR_THRESHOLD = 0.18;
        const MAR_THRESHOLD = 0.60;
        const YAW_THRESHOLD = 25;
        const PITCH_THRESHOLD = 20;
        const PERCLOS_THRESHOLD = 0.10;
        const PERCLOS_WINDOW = 60000;
        const MSLEEP_MIN = 500;
        const MSLEEP_MAX = 3000;
        const SLOW_BLINK_MS = 500;
        const GAZE_OFF_THRESHOLD = 3000;
        const NOD_THRESHOLD = 18;
        const MIN_DETECT_INTERVAL = 100;

        // ==================== STATE ====================
        let faceLandmarker = null;
        let streaming = false;
        let detecting = false;
        let frameIdx = 0;
        let baseYaw = 0, basePitch = 0, calibrated = false;
        let lastVideoTime = -1;
        let lastDetectTime = 0;
        let frameCount = 0, lastFpsTime = Date.now();
        let consecutiveErrors = 0;

        let eyesClosed = false;
        let blinkStart = 0;
        let blinkDurations = [];
        let blinkTimestamps = [];
        let slowBlinkCount = 0;
        let microsleepCount = 0;

        let eyeClosureSum = 0;
        let eyeClosureWindowStart = 0;
        let eyeClosureFrameCount = 0;

        let gazeOffStart = 0;
        let nodCount = 0;
        let nodCooldown = false;

        let prevEAR = 0.3, prevMAR = 0.1, prevYaw = 0, prevPitch = 0;
        const beta = 0.7, alpha = 0.15;

        function oneEuro(prev, raw) {
            const diff = Math.abs(raw - prev);
            const rate = diff * 30;
            const c = 1.0 / (1.0 + (1.0 / beta) * Math.exp(-rate * alpha));
            return prev + c * (raw - prev);
        }

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString();
            logEl.innerHTML = `<div>[${t}] ${msg}</div>` + logEl.innerHTML;
            if (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
            console.log(msg);
        }

        window.onerror = (msg, src, line, col, err) => {
            log(`❌ JS ERROR: ${msg} (${line}:${col})`);
            detecting = false;
        };
        window.addEventListener('unhandledrejection', (e) => {
            log(`❌ PROMISE REJECT: ${e.reason}`);
            detecting = false;
        });

        const L_EYE = [33, 160, 158, 133, 153, 144];
        const R_EYE = [362, 385, 387, 263, 373, 380];
        const MOUTH = [61, 13, 14, 87, 178, 88, 95, 78, 191, 80, 81, 82];

        // ==================== LOAD MODEL ====================
        async function loadModel() {
            log('Loading MediaPipe...');
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );
            log('WASM loaded, creating model...');
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                    delegate: "CPU"
                },
                runningMode: "VIDEO",
                numFaces: 1,
                minFaceDetectionConfidence: 0.3,
                minFacePresenceConfidence: 0.3,
                minTrackingConfidence: 0.3,
                outputFaceBlendshapes: true,
                outputFacialTransformationMatrixes: true
            });
            document.getElementById('loading').classList.add('hidden');
            log('Model loaded OK');
        }

        // ==================== GEOMETRY ====================
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + ((a.z || 0) - (b.z || 0)) ** 2);
        }

        function calcEAR(eye) {
            const v1 = dist(eye[1], eye[5]);
            const v2 = dist(eye[2], eye[4]);
            const h = dist(eye[0], eye[3]);
            return (v1 + v2) / (2.0 * h + 0.001);
        }

        function calcMAR(mouth) {
            let total = 0;
            for (let i = 0; i < mouth.length - 1; i++) total += dist(mouth[i], mouth[i + 1]);
            const h = dist(mouth[0], mouth[Math.floor(mouth.length / 2)]);
            return total / (mouth.length * h + 0.001);
        }

        // ==================== HEAD POSE ====================
        function matrixToEuler(m) {
            const sy = Math.sqrt(m[0] * m[0] + m[1] * m[1]);
            const singular = sy < 1e-6;
            let yaw, pitch, roll;
            if (!singular) {
                yaw = Math.atan2(m[8], m[10]);
                pitch = Math.atan2(-m[9], sy);
                roll = Math.atan2(m[1], m[5]);
            } else {
                yaw = Math.atan2(-m[2], m[10]);
                pitch = Math.atan2(-m[9], sy);
                roll = 0;
            }
            return { yaw: yaw * 180 / Math.PI, pitch: pitch * 180 / Math.PI, roll: roll * 180 / Math.PI };
        }

        // ==================== GAZE ====================
        function getGaze(pts) {
            const lIn = pts[33], lOut = pts[133];
            const rIn = pts[362], rOut = pts[263];
            const lIris = { x: (pts[159].x + pts[145].x) / 2, y: (pts[159].y + pts[145].y) / 2 };
            const rIris = { x: (pts[386].x + pts[374].x) / 2, y: (pts[386].y + pts[374].y) / 2 };
            const lR = (lIris.x - lIn.x) / (lOut.x - lIn.x + 0.001);
            const rR = (rIris.x - rIn.x) / (rOut.x - rIn.x + 0.001);
            const avg = (lR + rR) / 2;
            if (avg < 0.35) return 'right';
            if (avg > 0.65) return 'left';
            return 'center';
        }

        // ==================== EFFICIENT PERCLOS ====================
        function updatePERCLOS(isClosed, now) {
            if (eyeClosureWindowStart === 0) eyeClosureWindowStart = now;
            eyeClosureFrameCount++;
            if (isClosed) eyeClosureSum++;
            if (now - eyeClosureWindowStart >= PERCLOS_WINDOW) {
                eyeClosureSum = 0;
                eyeClosureFrameCount = 0;
                eyeClosureWindowStart = now;
            }
            return eyeClosureFrameCount > 0 ? eyeClosureSum / eyeClosureFrameCount : 0;
        }

        // ==================== BLINK RATE ====================
        function getBlinkRate() {
            const now = performance.now();
            let count = 0;
            for (let i = blinkTimestamps.length - 1; i >= 0; i--) {
                if (now - blinkTimestamps[i] < 60000) count++;
                else break;
            }
            return count;
        }

        // ==================== DETECT ====================
        function detect() {
            if (!streaming) return;
            if (detecting) { requestAnimationFrame(detect); return; }

            const now = performance.now();
            if (!faceLandmarker || video.currentTime === lastVideoTime) { requestAnimationFrame(detect); return; }

            detecting = true;
            lastDetectTime = now;
            lastVideoTime = video.currentTime;

            let results;
            try {
                results = faceLandmarker.detectForVideo(video, now);
                consecutiveErrors = 0;
            } catch (e) {
                consecutiveErrors++;
                detecting = false;
                if (consecutiveErrors <= 3) log(`Detect error #${consecutiveErrors}: ${e.message || e}`);
                if (consecutiveErrors > 5) { lastVideoTime = -1; log('Resetting detection after 5 errors'); }
                requestAnimationFrame(detect);
                return;
            }

            const w = overlay.width = video.videoWidth;
            const h = overlay.height = video.videoHeight;
            ctx.clearRect(0, 0, w, h);

            if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
                calibrated = false;
                eyesClosed = false;
                updateUI({ face: false, ear: 0, mar: 0, gaze: '-', yaw: 0, pitch: 0, alerts: ['NO_FACE'] });
                detecting = false;
                requestAnimationFrame(detect);
                return;
            }

            const lm = results.faceLandmarks[0];
            const bs = results.faceBlendshapes && results.faceBlendshapes[0] && Array.isArray(results.faceBlendshapes[0]) ? results.faceBlendshapes[0] : [];
            const mat = results.facialTransformationMatrixes ? results.facialTransformationMatrixes[0] : null;

            // Face bounding box
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            for (const p of lm) {
                if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
            }
            const pad = 0.08;
            minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
            maxX = Math.min(1, maxX + pad); maxY = Math.min(1, maxY + pad);
            ctx.strokeStyle = 'rgba(0,212,255,0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(minX * w, minY * h, (maxX - minX) * w, (maxY - minY) * h);

            // Helper: draw dots + thin connecting lines
            function drawPoly(ids, color, lw, close) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = lw;
                ctx.beginPath();
                ctx.moveTo(lm[ids[0]].x * w, lm[ids[0]].y * h);
                for (let i = 1; i < ids.length; i++) ctx.lineTo(lm[ids[i]].x * w, lm[ids[i]].y * h);
                if (close) ctx.closePath();
                ctx.stroke();
                for (const id of ids) {
                    ctx.beginPath();
                    ctx.arc(lm[id].x * w, lm[id].y * h, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Eyes
            drawPoly([33,7,163,144,145,153,154,155,133], '#00d4ff', 1, true);
            drawPoly([362,382,381,380,374,373,390,249,263], '#00d4ff', 1, true);

            // Iris center dots
            ctx.fillStyle = '#00ff00';
            ctx.beginPath(); ctx.arc(lm[468].x*w, lm[468].y*h, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(lm[473].x*w, lm[473].y*h, 3, 0, Math.PI*2); ctx.fill();

            // Eyebrows
            drawPoly([70,63,105,66,107,55,65,52,53,46], '#ff9800', 1.5, false);
            drawPoly([300,293,334,296,336,285,295,282,283,276], '#ff9800', 1.5, false);

            // Mouth
            drawPoly([61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185], '#ff4444', 1, true);

            // Nose
            drawPoly([168,6,197,195,5,4,1,19,94,2], '#aaaaaa', 1, false);

            // Jawline
            drawPoly([234,93,132,58,172,136,150,149,176,148,152,377,400,378,379,365,397,288,361,323,454,356,389], '#666666', 1, false);

            // 3D Axis from nose tip
            if (mat) {
                const noseX = lm[1].x * w, noseY = lm[1].y * h;
                const axisLen = 60;
                const rx = [mat[0], mat[1], mat[2]];
                const ry = [mat[4], mat[5], mat[6]];
                const rz = [mat[8], mat[9], mat[10]];

                ctx.lineWidth = 2.5;
                ctx.font = 'bold 11px Arial';

                ctx.strokeStyle = '#f44336';
                ctx.beginPath(); ctx.moveTo(noseX, noseY); ctx.lineTo(noseX + rx[0] * axisLen, noseY + rx[1] * axisLen); ctx.stroke();
                ctx.fillStyle = '#f44336'; ctx.fillText('X', noseX + rx[0] * axisLen + 5, noseY + rx[1] * axisLen);

                ctx.strokeStyle = '#4caf50';
                ctx.beginPath(); ctx.moveTo(noseX, noseY); ctx.lineTo(noseX + ry[0] * axisLen, noseY + ry[1] * axisLen); ctx.stroke();
                ctx.fillStyle = '#4caf50'; ctx.fillText('Y', noseX + ry[0] * axisLen + 5, noseY + ry[1] * axisLen);

                ctx.strokeStyle = '#2196f3'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(noseX, noseY); ctx.lineTo(noseX + rz[0] * axisLen, noseY + rz[1] * axisLen); ctx.stroke();
                ctx.fillStyle = '#2196f3'; ctx.beginPath(); ctx.arc(noseX + rz[0] * axisLen, noseY + rz[1] * axisLen, 4, 0, Math.PI * 2); ctx.fill();
                ctx.fillText('Z (gaze)', noseX + rz[0] * axisLen + 6, noseY + rz[1] * axisLen);

                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(noseX, noseY, 3, 0, Math.PI * 2); ctx.fill();
            }

            // EAR
            let ear = 0.3;
            if (bs.length > 0) {
                const lB = bs.find(b => b.categoryName === 'eyeBlinkLeft');
                const rB = bs.find(b => b.categoryName === 'eyeBlinkRight');
                ear = ((lB ? 1 - lB.score : 0.5) + (rB ? 1 - rB.score : 0.5)) / 2;
            } else {
                ear = (calcEAR(L_EYE.map(i => lm[i])) + calcEAR(R_EYE.map(i => lm[i]))) / 2;
            }
            ear = oneEuro(prevEAR, ear); prevEAR = ear;

            let mar = 0;
            if (bs.length > 0) {
                const jaw = bs.find(b => b.categoryName === 'jawOpen');
                mar = jaw ? jaw.score : 0;
            } else {
                mar = calcMAR(MOUTH.map(i => lm[i]));
            }
            mar = oneEuro(prevMAR, mar); prevMAR = mar;

            // Head pose
            let yaw = 0, pitch = 0;
            if (mat) {
                const e = matrixToEuler(mat);
                yaw = e.yaw; pitch = e.pitch;
            } else {
                const nose = lm[1], lEye = lm[33], rEye = lm[263], fore = lm[10], chin = lm[152];
                const eyeCx = (lEye.x + rEye.x) / 2;
                const eyeW = dist(lEye, rEye);
                const faceH = dist(fore, chin);
                yaw = ((nose.x - eyeCx) / eyeW) * 50;
                pitch = ((nose.y - (fore.y + chin.y) / 2) / (faceH * 0.5)) * 50;
            }
            yaw = oneEuro(prevYaw, yaw); pitch = oneEuro(prevPitch, pitch);
            prevYaw = yaw; prevPitch = pitch;

            frameIdx++;
            if (frameIdx <= 30) { baseYaw = yaw; basePitch = pitch; calibrated = false; }
            else calibrated = true;

            const adjYaw = calibrated ? yaw - baseYaw : 0;
            const adjPitch = calibrated ? pitch - basePitch : 0;
            const gaze = calibrated ? getGaze(lm) : 'center';

            // Blink tracking
            const isClosed = ear < EAR_THRESHOLD;
            if (isClosed && !eyesClosed) {
                eyesClosed = true;
                blinkStart = now;
            } else if (!isClosed && eyesClosed) {
                eyesClosed = false;
                const dur = now - blinkStart;
                blinkDurations.push(dur);
                if (blinkDurations.length > 60) blinkDurations.shift();
                blinkTimestamps.push(now);
                if (blinkTimestamps.length > 60) blinkTimestamps.shift();
                if (dur > SLOW_BLINK_MS) slowBlinkCount++;
                if (dur >= MSLEEP_MIN && dur <= MSLEEP_MAX) microsleepCount++;
            }

            const blinkDur = eyesClosed ? (now - blinkStart) : 0;
            const blinkRate = getBlinkRate();
            const perclos = updatePERCLOS(isClosed, now);

            if (gaze !== 'center' && calibrated) {
                if (gazeOffStart === 0) gazeOffStart = now;
            } else {
                gazeOffStart = 0;
            }
            const gazeOffDur = gazeOffStart > 0 ? (now - gazeOffStart) / 1000 : 0;

            if (adjPitch > NOD_THRESHOLD && !nodCooldown) {
                nodCount++;
                nodCooldown = true;
                setTimeout(() => { nodCooldown = false; }, 2000);
            }

            // Alerts
            const alerts = [];
            if (perclos > PERCLOS_THRESHOLD) alerts.push('DROWSY (PERCLOS)');
            if (blinkDur > SLOW_BLINK_MS) alerts.push('SLOW_BLINK');
            if (blinkDur >= MSLEEP_MIN && blinkDur <= MSLEEP_MAX) alerts.push('MICROSLEEP');
            if (blinkDur > 3000) alerts.push('EYES_CLOSED_3s+');
            if (mar > MAR_THRESHOLD) alerts.push('YAWNING');
            if (gazeOffDur > GAZE_OFF_THRESHOLD / 1000) alerts.push('GAZE_OFF_ROAD');
            if (Math.abs(adjYaw) > YAW_THRESHOLD) alerts.push('LOOKING_SIDE');
            if (nodCount >= 3) alerts.push('HEAD_NODDING');
            if (adjPitch > PITCH_THRESHOLD) alerts.push('LOOKING_DOWN');
            if (blinkRate < 5 && calibrated && frameIdx > 60) alerts.push('LOW_BLINK_RATE');
            if (blinkRate > 30) alerts.push('HIGH_BLINK_RATE');

            updateUI({
                face: true, ear: ear.toFixed(3), mar: mar.toFixed(3),
                gaze, yaw: adjYaw.toFixed(1), pitch: adjPitch.toFixed(1),
                perclos: (perclos * 100).toFixed(1),
                blinkDur: Math.round(blinkDur),
                blinkRate, microsleepCount, gazeOffDur: gazeOffDur.toFixed(1),
                nodCount, alerts
            });

            frameCount++;
            if (Date.now() - lastFpsTime >= 1000) {
                document.getElementById('fps').textContent = 'FPS: ' + frameCount;
                frameCount = 0;
                lastFpsTime = Date.now();
            }

            detecting = false;
            requestAnimationFrame(detect);
        }

        // ==================== UI ====================
        function updateUI(d) {
            document.getElementById('faceVal').innerHTML = d.face ? '✅' : '❌';
            document.getElementById('earVal').textContent = d.ear;
            document.getElementById('marVal').textContent = d.mar;
            document.getElementById('gazeVal').textContent = d.gaze;
            document.getElementById('yawVal').textContent = d.yaw + '°';
            document.getElementById('pitchVal').textContent = d.pitch + '°';

            const perclosEl = document.getElementById('perclosVal');
            perclosEl.textContent = d.perclos + '%';
            perclosEl.parentElement.className = 'card' + (d.perclos > 10 ? ' danger' : d.perclos > 5 ? ' warn' : ' ok');

            const blinkDurEl = document.getElementById('blinkDurVal');
            blinkDurEl.textContent = d.blinkDur + 'ms';
            blinkDurEl.parentElement.className = 'card' + (d.blinkDur > 500 ? ' danger' : d.blinkDur > 300 ? ' warn' : ' ok');

            document.getElementById('blinkRateVal').textContent = d.blinkRate + '/min';
            document.getElementById('microsleepVal').textContent = d.microsleepCount;

            const gazeOffEl = document.getElementById('gazeOffVal');
            gazeOffEl.textContent = d.gazeOffDur + 's';
            gazeOffEl.parentElement.className = 'card' + (d.gazeOffDur > 3 ? ' danger' : d.gazeOffDur > 1 ? ' warn' : ' ok');

            document.getElementById('nodVal').textContent = d.nodCount;

            const box = document.getElementById('alertBox');
            if (!d.alerts || d.alerts.length === 0) {
                box.className = 'safe';
                box.textContent = 'SAFE - No alerts';
            } else {
                const hasDanger = d.alerts.some(a => a.includes('MICROSLEEP') || a.includes('EYES_CLOSED') || a.includes('PERCLOS'));
                box.className = hasDanger ? 'danger' : 'warning';
                box.textContent = '⚠️ ' + d.alerts.join(' | ');
                const hist = document.getElementById('history');
                const div = document.createElement('div');
                div.textContent = new Date().toLocaleTimeString() + ' - ' + d.alerts.join(', ');
                hist.prepend(div);
            }
        }

        // ==================== CAMERA ====================
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                streaming = true;
                frameIdx = 0;
                calibrated = false;
                lastVideoTime = -1;
                lastDetectTime = 0;
                consecutiveErrors = 0;
                eyeClosureSum = 0;
                eyeClosureWindowStart = 0;
                eyeClosureFrameCount = 0;
                blinkDurations = [];
                blinkTimestamps = [];
                slowBlinkCount = 0;
                microsleepCount = 0;
                nodCount = 0;
                gazeOffStart = 0;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                log('Camera started, waiting for video...');
                video.onloadedmetadata = () => { log(`Video: ${video.videoWidth}x${video.videoHeight}`); detect(); };
            } catch (err) {
                alert('Camera error: ' + err.message);
            }
        }

        function stopCamera() {
            streaming = false;
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            ctx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function resetAlerts() {
            frameIdx = 0;
            calibrated = false;
            lastVideoTime = -1;
            eyeClosureSum = 0;
            eyeClosureWindowStart = 0;
            eyeClosureFrameCount = 0;
            blinkDurations = [];
            blinkTimestamps = [];
            slowBlinkCount = 0;
            microsleepCount = 0;
            nodCount = 0;
            gazeOffStart = 0;
            document.getElementById('alertBox').className = 'safe';
            document.getElementById('alertBox').textContent = 'SAFE - Alerts reset';
        }

        window.startCamera = startCamera;
        window.stopCamera = stopCamera;
        window.resetAlerts = resetAlerts;

        loadModel();
    </script>
</body>
</html>
