<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f23; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; min-height: 100vh; padding: 10px; }
        h1 { font-size: 1.3em; margin: 10px 0; color: #00d4ff; }
        #videoContainer { position: relative; display: inline-block; width: 100%; max-width: 640px; }
        #video { width: 100%; border: 2px solid #00d4ff; border-radius: 8px; transform: scaleX(-1); display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        #canvas { display: none; }
        .controls { margin: 10px 0; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; margin: 4px; font-weight: bold; }
        .btn:active { background: #00a8cc; }
        .btn.stop { background: #f44336; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { display: flex; justify-content: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .card { background: #16213e; padding: 8px 12px; border-radius: 8px; min-width: 75px; }
        .card .label { font-size: 0.65em; color: #888; }
        .card .value { font-size: 1.1em; font-weight: bold; }
        #alertBox { padding: 12px; border-radius: 8px; margin: 10px 0; font-weight: bold; font-size: 1em; transition: all 0.3s; }
        .safe { background: #0a3d0a; color: #4caf50; }
        .warning { background: #3d2a0a; color: #ff9800; }
        .danger { background: #3d0a0a; color: #f44336; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f23; display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        #loading.hidden { display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #fps { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; font-size: 0.75em; }
        #history { max-height: 100px; overflow-y: auto; text-align: left; font-size: 0.8em; background: #16213e; padding: 8px; border-radius: 8px; margin-top: 10px; }
        #history div { padding: 2px 0; border-bottom: 1px solid #1a1a3e; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top:15px">Loading face detection model...</p>
        <p style="font-size:0.8em;color:#888;margin-top:5px">First time may take 30-60 seconds</p>
    </div>

    <h1>🚗 Driver Monitoring System</h1>

    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="fps">FPS: 0</div>
    </div>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="startCamera()">Start Camera</button>
        <button class="btn stop" id="stopBtn" onclick="stopCamera()" disabled>Stop</button>
        <button class="btn" onclick="resetAlerts()">Reset Alerts</button>
    </div>

    <div class="status">
        <div class="card"><div class="label">FACE</div><div class="value" id="faceVal">-</div></div>
        <div class="card"><div class="label">EAR</div><div class="value" id="earVal">-</div></div>
        <div class="card"><div class="label">MAR</div><div class="value" id="marVal">-</div></div>
        <div class="card"><div class="label">GAZE</div><div class="value" id="gazeVal">-</div></div>
        <div class="card"><div class="label">YAW</div><div class="value" id="yawVal">-</div></div>
        <div class="card"><div class="label">PITCH</div><div class="value" id="pitchVal">-</div></div>
    </div>

    <div id="alertBox" class="safe">SAFE - No alerts</div>
    <div id="history"></div>

    <canvas id="canvas"></canvas>

    <script>
        // ========== CONFIG ==========
        const EAR_THRESHOLD = 0.25;
        const EAR_CONSEC_FRAMES = 20;
        const MAR_THRESHOLD = 0.60;
        const MAR_CONSEC_FRAMES = 15;
        const YAW_THRESHOLD = 25;
        const PITCH_THRESHOLD = 20;
        const POSE_CONSEC_FRAMES = 15;
        const SMOOTHING = 0.35;

        // ========== STATE ==========
        let earCounter = 0;
        let marCounter = 0;
        let yawCounter = 0;
        let pitchCounter = 0;
        let streaming = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let calibrated = false;
        let baselinePitch = 0;
        let baselineYaw = 0;
        let frameIndex = 0;

        // Smoothed values
        let smEAR = 0, smMAR = 0, smYaw = 0, smPitch = 0;

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const overlayCtx = overlay.getContext('2d');

        const LEFT_EYE = [36, 37, 38, 39, 40, 41];
        const RIGHT_EYE = [42, 43, 44, 45, 46, 47];
        const MOUTH = [60, 61, 62, 63, 64, 65, 66, 67];

        // ========== LOAD MODEL ==========
        async function loadModel() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            document.getElementById('loading').classList.add('hidden');
        }

        // ========== GEOMETRY ==========
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        function calcEAR(eye) {
            const v1 = dist(eye[1], eye[5]);
            const v2 = dist(eye[2], eye[4]);
            const h = dist(eye[0], eye[3]);
            return (v1 + v2) / (2.0 * h);
        }

        function calcMAR(mouth) {
            const v1 = dist(mouth[1], mouth[7]);
            const v2 = dist(mouth[2], mouth[6]);
            const v3 = dist(mouth[3], mouth[5]);
            const h = dist(mouth[0], mouth[4]);
            return (v1 + v2 + v3) / (3.0 * h);
        }

        function smooth(prev, raw) {
            return prev * (1 - SMOOTHING) + raw * SMOOTHING;
        }

        // ========== HEAD POSE ==========
        function getHeadPose(pts) {
            const nose = pts[30];
            const leftEye = pts[36];
            const rightEye = pts[45];
            const forehead = pts[27];
            const chin = pts[8];

            const eyeCx = (leftEye.x + rightEye.x) / 2;
            const eyeCy = (leftEye.y + rightEye.y) / 2;
            const eyeW = dist(leftEye, rightEye);
            const faceH = dist(forehead, chin);

            // Yaw: nose horizontal offset relative to eye width
            const rawYaw = ((nose.x - eyeCx) / eyeW) * 50;

            // Pitch: nose vertical offset relative to face height
            const faceMidY = (forehead.y + chin.y) / 2;
            const rawPitch = ((nose.y - faceMidY) / (faceH * 0.5)) * 50;

            return { rawYaw, rawPitch };
        }

        // ========== GAZE ==========
        function getGaze(pts) {
            const lInner = pts[39], lOuter = pts[36];
            const rInner = pts[42], rOuter = pts[45];

            const lIris = { x: (pts[37].x + pts[38].x) / 2, y: (pts[37].y + pts[38].y) / 2 };
            const rIris = { x: (pts[43].x + pts[44].x) / 2, y: (pts[43].y + pts[44].y) / 2 };

            const lRatio = (lIris.x - lInner.x) / (lOuter.x - lInner.x + 0.001);
            const rRatio = (rIris.x - rInner.x) / (rOuter.x - rInner.x + 0.001);
            const avg = (lRatio + rRatio) / 2;

            if (avg < 0.35) return 'right';
            if (avg > 0.65) return 'left';
            return 'center';
        }

        // ========== DETECT ==========
        async function detect() {
            if (!streaming) return;

            const det = await faceapi
                .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 }))
                .withFaceLandmarks();

            overlay.width = video.videoWidth;
            overlay.height = video.videoHeight;
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

            if (det.length === 0) {
                calibrated = false;
                updateUI({ face: false, ear: 0, mar: 0, gaze: '-', yaw: 0, pitch: 0, alerts: ['NO_FACE'] });
                requestAnimationFrame(detect);
                return;
            }

            const d = det[0];
            const pts = d.landmarks.positions;
            const box = d.detection.box;

            // Draw
            overlayCtx.strokeStyle = '#00ff00';
            overlayCtx.lineWidth = 2;
            overlayCtx.strokeRect(box.x, box.y, box.width, box.height);
            overlayCtx.fillStyle = '#00ff00';
            for (const p of pts) {
                overlayCtx.beginPath();
                overlayCtx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                overlayCtx.fill();
            }

            // EAR
            const rawEAR = (calcEAR(LEFT_EYE.map(i => pts[i])) + calcEAR(RIGHT_EYE.map(i => pts[i]))) / 2;
            smEAR = smooth(smEAR, rawEAR);

            // MAR
            const rawMAR = calcMAR(MOUTH.map(i => pts[i]));
            smMAR = smooth(smMAR, rawMAR);

            // Head pose
            const pose = getHeadPose(pts);
            smYaw = smooth(smYaw, pose.rawYaw);
            smPitch = smooth(smPitch, pose.rawPitch);

            // Calibrate on first 30 frames (capture neutral pose)
            frameIndex++;
            if (frameIndex <= 30) {
                baselineYaw = smYaw;
                baselinePitch = smPitch;
                calibrated = false;
            } else {
                calibrated = true;
            }

            const adjYaw = calibrated ? smYaw - baselineYaw : 0;
            const adjPitch = calibrated ? smPitch - baselinePitch : 0;

            // Gaze
            const gaze = calibrated ? getGaze(pts) : 'center';

            // ===== ALERTS =====
            const alerts = [];

            // Drowsy
            if (smEAR < EAR_THRESHOLD) { earCounter++; if (earCounter >= EAR_CONSEC_FRAMES) alerts.push('DROWSY'); }
            else earCounter = 0;

            // Yawning
            if (smMAR > MAR_THRESHOLD) { marCounter++; if (marCounter >= MAR_CONSEC_FRAMES) alerts.push('YAWNING'); }
            else marCounter = 0;

            // Looking side
            if (Math.abs(adjYaw) > YAW_THRESHOLD) { yawCounter++; if (yawCounter >= POSE_CONSEC_FRAMES) alerts.push('LOOKING_SIDE'); }
            else yawCounter = 0;

            // Looking down
            if (adjPitch > PITCH_THRESHOLD) { pitchCounter++; if (pitchCounter >= POSE_CONSEC_FRAMES) alerts.push('LOOKING_DOWN'); }
            else pitchCounter = 0;

            updateUI({
                face: true, ear: smEAR.toFixed(3), mar: smMAR.toFixed(3),
                gaze, yaw: adjYaw.toFixed(1), pitch: adjPitch.toFixed(1), alerts
            });

            frameCount++;
            if (Date.now() - lastFpsTime >= 1000) {
                document.getElementById('fps').textContent = 'FPS: ' + frameCount;
                frameCount = 0;
                lastFpsTime = Date.now();
            }
            requestAnimationFrame(detect);
        }

        // ========== UI ==========
        function updateUI(data) {
            document.getElementById('faceVal').innerHTML = data.face ? '✅' : '❌';
            document.getElementById('earVal').textContent = data.ear;
            document.getElementById('marVal').textContent = data.mar;
            document.getElementById('gazeVal').textContent = data.gaze;
            document.getElementById('yawVal').textContent = data.yaw + '°';
            document.getElementById('pitchVal').textContent = data.pitch + '°';

            const box = document.getElementById('alertBox');
            if (!data.alerts || data.alerts.length === 0) {
                box.className = 'safe';
                box.textContent = 'SAFE - No alerts';
            } else {
                box.className = 'danger';
                box.textContent = '⚠️ ' + data.alerts.join(' | ');
                const hist = document.getElementById('history');
                const div = document.createElement('div');
                div.textContent = new Date().toLocaleTimeString() + ' - ' + data.alerts.join(', ');
                hist.prepend(div);
            }
        }

        // ========== CAMERA ==========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                streaming = true;
                frameIndex = 0;
                calibrated = false;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                video.onloadedmetadata = () => detect();
            } catch (err) {
                alert('Camera error: ' + err.message);
            }
        }

        function stopCamera() {
            streaming = false;
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        }

        function resetAlerts() {
            earCounter = marCounter = yawCounter = pitchCounter = 0;
            frameIndex = 0;
            calibrated = false;
            document.getElementById('alertBox').className = 'safe';
            document.getElementById('alertBox').textContent = 'SAFE - Alerts reset';
        }

        loadModel();
    </script>
</body>
</html>
